name: purchases_flutter
description: Flutter in-app purchases and subscriptions made easy. The plugin supports iOS, macOS and Android.
version: 10.13.2
publish_to: none # RevenueDot fork: installed from git; the package name is kept so imports keep working
homepage: https://revenuedot.app
repository: https://github.com/revenuedot/purchases-flutter
issue_tracker: https://github.com/revenuedot/purchases-flutter/issues
documentation: https://revenuedot.app/docs

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.1
  equatable: ^2.0.0

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_lints: ^2.0.1
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.revenuecat.purchases_flutter
        pluginClass: PurchasesFlutterPlugin
      ios:
        pluginClass: PurchasesFlutterPlugin
      macos:
        pluginClass: PurchasesFlutterPlugin
      web:
        pluginClass: PurchasesFlutterPlugin
        fileName: web/purchases_flutter_web.dart
  assets:
    # Vendored RevenueCat web SDK (purchases-js-hybrid-mappings UMD bundle).
    # Bundled locally so it can be loaded same-origin, which is required by
    # strict CSP environments such as Chrome Extension Manifest V3 pages that
    # disallow remotely-hosted code. Kept in sync with the bumped
    # purchases-hybrid-common version by the fastlane `update_hybrid_common` lane.
    - path: assets/web/
      platforms:
        - web
